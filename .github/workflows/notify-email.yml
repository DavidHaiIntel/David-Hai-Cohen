name: Notify on push

on:
  push:
    branches: [ main ]

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - name: Send notification email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Birthday Site Bot <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "✅ עודכן אתר יום ההולדת — ${{ github.event.head_commit.message }}"
          body: |
            בוצע עדכון ונדחף לאתר של יום ההולדת 🎉

            הודעת העדכון: ${{ github.event.head_commit.message }}
            מבצע: ${{ github.actor }}
            זמן: ${{ github.event.head_commit.timestamp }}

            צפייה באתר:
            https://davidhaiintel.github.io/David-Hai-Cohen/index.html
